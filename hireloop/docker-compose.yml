services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hireloop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hireloop}
      POSTGRES_DB: ${POSTGRES_DB:-hireloop}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hireloop}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-hireloop}:${POSTGRES_PASSWORD:-hireloop}@postgres:5432/${POSTGRES_DB:-hireloop}
      DATABASE_SYNC_URL: postgresql+psycopg://${POSTGRES_USER:-hireloop}:${POSTGRES_PASSWORD:-hireloop}@postgres:5432/${POSTGRES_DB:-hireloop}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-hireloop}:${POSTGRES_PASSWORD:-hireloop}@postgres:5432/${POSTGRES_DB:-hireloop}
      DATABASE_SYNC_URL: postgresql+psycopg://${POSTGRES_USER:-hireloop}:${POSTGRES_PASSWORD:-hireloop}@postgres:5432/${POSTGRES_DB:-hireloop}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./api:/app
    command: python -m worker.main

  web:
    build:
      context: ./web
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next

volumes:
  pgdata:
