name: ci

on:
  push:
    branches: [main, "feat/**", "strategy/**"]
  pull_request:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hireloop/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install --upgrade pip && pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - name: Type check
        run: mypy app || true   # advisory in V0
      - name: Tests (DB-free)
        env:
          OWNER_EMAIL: owner@example.com
          SESSION_SECRET: test-test-test-test-test
          DATABASE_URL: postgresql+asyncpg://x:y@localhost/none
          DATABASE_SYNC_URL: postgresql+psycopg://x:y@localhost/none
        run: pytest -q tests/test_health.py tests/test_state_machine.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hireloop/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: hireloop/web/package.json
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
