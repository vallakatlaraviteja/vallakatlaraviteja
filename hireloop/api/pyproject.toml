[project]
name = "hireloop-api"
version = "0.1.0"
description = "Hireloop API — personal job-acquisition cockpit"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "sqlalchemy[asyncio]==2.0.35",
    "alembic==1.13.3",
    "asyncpg==0.29.0",
    "psycopg[binary]==3.2.3",
    "redis==5.0.8",
    "rq==1.16.2",
    "httpx==0.27.2",
    "anthropic==0.39.0",
    "openai==1.51.2",
    "structlog==24.4.0",
    "sentry-sdk==2.14.0",
    "pgvector==0.3.6",
    "python-multipart==0.0.12",
    "itsdangerous==2.2.0",
    "tenacity==9.0.0",
    "beautifulsoup4==4.12.3",
    "readability-lxml==0.8.1",
    "lxml==5.3.0",
    "weasyprint==63.0",
    "markdown==3.7",
    "click==8.1.7",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "httpx==0.27.2",
    "ruff==0.6.9",
    "mypy==1.11.2",
    "types-Markdown==3.7.0.20240822",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "worker*", "ops*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
